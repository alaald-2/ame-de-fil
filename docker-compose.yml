services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ame_de_fil
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher (DECISIONS.md ADR-018/ADR-031) — real vendor
  # selection remains deferred (ROADMAP.md Phase 4). Point
  # SMTP_HOST=localhost / SMTP_PORT=1025 at this in apps/api/.env; sent
  # mail never leaves the box, viewable at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
